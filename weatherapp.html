<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 2rem; background: #f4f4f4; }
    h1 { color: #4A90E2; margin-bottom: 1rem; }
    input, button { padding: 0.5rem; margin: 0.5rem; }
    #weather { margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Weather App</h1>
  <input type="text" id="city" placeholder="Enter city">
  <button onclick="showWeather()">Check Weather</button>
  <div id="weather"></div>

  <script>
    function showWeather() {
      const city = document.getElementById('city').value.trim();
      if(!city) return alert('Enter a city');
      // Simple static example
      const data = {
        Nairobi: 'Sunny, 28°C',
        London: 'Cloudy, 18°C',
        NewYork: 'Rainy, 22°C'
      };
      document.getElementById('weather').textContent = data[city] || 'Weather data not found';
    }
  </script>
</body>
</html>
